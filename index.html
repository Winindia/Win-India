            const name = document.getElementById('user-name-inp').value;
            if(name.length < 3) return alert("Enter valid name!");

            alert("Your Security OTP: " + otp);
            let userOtp = prompt("Enter OTP:");
            if(userOtp == otp) loginPlayer(name);
        }

        function loginPlayer(name) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('nav-bar').style.display = 'flex';
            document.getElementById('display-name').innerText = name.toUpperCase();
            playerStats.coins = 100;
            document.getElementById('coin-val').innerText = playerStats.coins;
            renderGames();
            startTimer();
        }

        function startTimer() {
            setInterval(() => {
                playerStats.timeActive++;
                let m = Math.floor(playerStats.timeActive / 60);
                let s = playerStats.timeActive % 60;
                document.getElementById('live-timer').innerText = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
                if(playerStats.timeActive >= 600) {
                    document.getElementById('spin-btn').disabled = false;
                    document.getElementById('spin-btn').innerText = "SPIN UNLOCKED";
                }
            }, 1000);
        }

        function handleSpin() {
            let win = Math.floor(Math.random() * 5000) + 500;
            playerStats.coins += win;
            document.getElementById('coin-val').innerText = playerStats.coins;
            alert("You Won 💰" + win + " Coins!");
            playerStats.timeActive = 0;
            document.getElementById('spin-btn').disabled = true;
        }
